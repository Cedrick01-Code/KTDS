version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ktds-db
    restart: always
    environment:
      POSTGRES_USER: ktds_user
      POSTGRES_PASSWORD: ktds_password
      POSTGRES_DB: ktds_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
